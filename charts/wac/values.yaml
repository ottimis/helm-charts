replicaCount: 1
storageClass: ""
updateStrategy: "RollingUpdate"
nodeSelector: {}
preventRoot: true

# List of Secret names for pulling images from private registries
imagePullSecrets: []

image:
  repository: 348705108113.dkr.ecr.eu-central-1.amazonaws.com/ottimis/php:8.3.11-bullseye
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80
  targetPort: 8080
  # Additional ports for multi-port services (e.g., HTTP + WebSocket)
  # Example for NestJS with HTTP on 3000 and WS on 3001:
  # ports:
  #   - name: http
  #     port: 80
  #     targetPort: 3000
  #   - name: ws
  #     port: 3001
  #     targetPort: 3001
  ports: []

ingress:
  enabled: false
  className: "alb"
  certificateArn: ""
  groupName: "frontend-public"
  customAnnotations: {}
  hosts: []
  path: "/"
  additionalRoutesBefore: []
  additionalRoutesAfter: []
  # - path: /anotherpath
  #   serviceName: another-service
  #   servicePort: 80
sftp:
  enabled: false
  users:
    - username: "username"
      # Encrypted password is 'password'
      # openssl passwd -1 -stdin <<< password
      password: "$1$7FmUurbc$9oCGcoGoZSY2P64vtFWtE."
      uid: 1000
      gid: 1000
  image:
    tag: "latest"

deployment:
  # Override container command and args (useful for multi-entrypoint images)
  # Example:
  #   command: ["python", "-m", "src.worker"]
  #   args: ["--verbose"]
  command: []
  args: []
  customHtaccessCM: ""
  existingSecretsEnv: []
  existingConfigMapsEnv: []
  # key-value pairs to set environment variables
    # Example:
    # env:
    #   ENV_VAR_NAME: "value"
  env: {}
  customIniCM: ""
  resources: {}
  uid: 1000
  gid: 1000
  gracefulShutdownSeconds: 60
  serviceAccountName: ""
  # key-value pairs to set node affinity
  # Example:
    # nodeAffinity:
    #   disktype: ssd
  nodeAffinity: {}
  preventSameNode: true

onePasswordSecrets: []
