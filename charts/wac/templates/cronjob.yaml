{{- range $job := .Values.cronjobs }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "wac.name" $ }}-{{ $job.name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ include "wac.name" $ }}
    app.kubernetes.io/instance: {{ $.Release.Name }}
    app.kubernetes.io/component: cronjob-{{ $job.name }}
spec:
  schedule: {{ $job.schedule | quote }}
  {{- if $job.startingDeadlineSeconds }}
  startingDeadlineSeconds: {{ $job.startingDeadlineSeconds }}
  {{- end }}
  concurrencyPolicy: {{ $job.concurrencyPolicy | default "Forbid" }}
  successfulJobsHistoryLimit: {{ $job.successfulJobsHistoryLimit | default 1 }}
  failedJobsHistoryLimit: {{ $job.failedJobsHistoryLimit | default 3 }}
  {{- if $job.suspend }}
  suspend: {{ $job.suspend }}
  {{- end }}
  jobTemplate:
    spec:
      {{- if $job.activeDeadlineSeconds }}
      activeDeadlineSeconds: {{ $job.activeDeadlineSeconds }}
      {{- end }}
      {{- if hasKey $job "backoffLimit" }}
      backoffLimit: {{ $job.backoffLimit }}
      {{- end }}
      template:
        metadata:
          labels:
            app.kubernetes.io/name: {{ include "wac.name" $ }}
            app.kubernetes.io/instance: {{ $.Release.Name }}
            app.kubernetes.io/component: cronjob-{{ $job.name }}
        spec:
          securityContext:
            {{- if $.Values.preventRoot }}
            fsGroup: {{ $.Values.deployment.gid }}
            runAsUser: {{ $.Values.deployment.uid }}
            runAsNonRoot: true
            {{- else }}
            runAsUser: 0
            runAsNonRoot: false
            {{- end }}
          {{- if $.Values.deployment.serviceAccountName }}
          serviceAccountName: {{ $.Values.deployment.serviceAccountName }}
          {{- end }}
          {{- if $.Values.imagePullSecrets }}
          imagePullSecrets:
            {{- range $.Values.imagePullSecrets }}
            - name: {{ . }}
            {{- end }}
          {{- end }}
          restartPolicy: {{ $job.restartPolicy | default "OnFailure" }}
          containers:
            - name: {{ $job.name }}
              image: "{{ $job.image | default $.Values.image.repository }}"
              imagePullPolicy: {{ $.Values.image.pullPolicy }}
              {{- if $job.command }}
              command:
                {{- toYaml $job.command | nindent 16 }}
              {{- end }}
              {{- if $job.args }}
              args:
                {{- toYaml $job.args | nindent 16 }}
              {{- end }}
              resources:
                {{- toYaml ($job.resources | default $.Values.deployment.resources) | nindent 16 }}
              securityContext:
                {{- if $.Values.preventRoot }}
                runAsUser: {{ $.Values.deployment.uid }}
                runAsGroup: {{ $.Values.deployment.gid }}
                runAsNonRoot: true
                allowPrivilegeEscalation: false
                {{- else }}
                runAsUser: 0
                runAsNonRoot: false
                {{- end }}
              {{- if or $.Values.deployment.env $job.env }}
              env:
                {{- range $key, $value := $.Values.deployment.env }}
                - name: {{ $key }}
                  value: {{ $value | quote }}
                {{- end }}
                {{- range $key, $value := $job.env }}
                - name: {{ $key }}
                  value: {{ $value | quote }}
                {{- end }}
              {{- end }}
              envFrom:
                {{- range $.Values.deployment.existingConfigMapsEnv }}
                - configMapRef:
                    name: {{ . }}
                {{- end }}
                {{- range $.Values.deployment.existingSecretsEnv }}
                - secretRef:
                    name: {{ . }}
                {{- end }}
                {{- range $.Values.onePasswordSecrets }}
                - secretRef:
                    name: {{ .name }}
                {{- end }}
              {{- if or $job.volumes (gt (len $.Values.onePasswordSecrets) 0) }}
              volumeMounts:
                {{- range $volName := $job.volumes }}
                {{- range $volume := $.Values.volumes }}
                {{- if eq $volume.name $volName }}
                {{- range $mountPath := $volume.mountPaths }}
                - name: {{ include "wac.name" $ }}-{{ $volume.name }}
                  mountPath: {{ $mountPath.path }}
                  subPath: {{ $mountPath.subPath | default "" }}
                {{- end }}
                {{- end }}
                {{- end }}
                {{- end }}
                {{- range $secret := $.Values.onePasswordSecrets }}
                {{- if $secret.mountPaths }}
                {{- range $mountPath := $secret.mountPaths }}
                - name: op-{{ $secret.name }}
                  mountPath: {{ $mountPath.path }}
                  subPath: {{ $mountPath.subPath | default "" }}
                {{- end }}
                {{- end }}
                {{- end }}
              {{- end }}
          {{- if or $job.volumes (gt (len $.Values.onePasswordSecrets) 0) }}
          volumes:
            {{- range $volName := $job.volumes }}
            {{- range $volume := $.Values.volumes }}
            {{- if eq $volume.name $volName }}
            - name: {{ include "wac.name" $ }}-{{ $volume.name }}
              {{- if $volume.configMap }}
              configMap:
                name: {{ $volume.configMap }}
              {{- else if $volume.secret }}
              secret:
                secretName: {{ $volume.secret }}
              {{- else }}
              persistentVolumeClaim:
                claimName: {{ include "wac.name" $ }}-{{ $volume.name }}
              {{- end }}
            {{- end }}
            {{- end }}
            {{- end }}
            {{- range $.Values.onePasswordSecrets }}
            {{- if .mountPaths }}
            - name: op-{{ .name }}
              secret:
                secretName: {{ .name }}
            {{- end }}
            {{- end }}
          {{- end }}
          {{- $hasNodeAff := not (empty $.Values.deployment.nodeAffinity) }}
          {{- if $hasNodeAff }}
          tolerations:
            {{- range $key, $value := $.Values.deployment.nodeAffinity }}
            - key: {{ $key | quote }}
              operator: "Equal"
              value: {{ $value | quote }}
              effect: "NoSchedule"
            {{- end }}
          nodeSelector:
            {{- toYaml $.Values.nodeSelector | nindent 12 }}
          {{- end }}
{{- end }}