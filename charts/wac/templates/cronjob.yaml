{{- include "wac.validateCronjobs" . }}
{{- $defaults := .Values.cronjobDefaults | default dict }}
{{- range $job := .Values.cronjobs }}
{{- if eq ($job.runIn | default "job") "job" }}
{{- /* Precedence: job value > cronjobDefaults > not emitted. hasKey so 0 is valid and null opts out
     (sprig `get` returns "" for a missing key, hence the "" checks below). */}}
{{- $ttl := ternary (get $job "ttlSecondsAfterFinished") (get $defaults "ttlSecondsAfterFinished") (hasKey $job "ttlSecondsAfterFinished") }}
{{- $activeDeadline := ternary (get $job "activeDeadlineSeconds") (get $defaults "activeDeadlineSeconds") (hasKey $job "activeDeadlineSeconds") }}
{{- $backoff := ternary (get $job "backoffLimit") (get $defaults "backoffLimit") (hasKey $job "backoffLimit") }}
{{- $timeZone := ternary (get $job "timeZone") (get $defaults "timeZone") (hasKey $job "timeZone") }}
{{- $resources := ternary (get $job "resources") (get $defaults "resources") (hasKey $job "resources") }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "wac.name" $ }}-{{ $job.name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ include "wac.name" $ }}
    app.kubernetes.io/instance: {{ $.Release.Name }}
    app.kubernetes.io/component: cronjob-{{ $job.name }}
spec:
  schedule: {{ $job.schedule | quote }}
  {{- if $timeZone }}
  timeZone: {{ $timeZone | quote }}
  {{- end }}
  {{- if $job.startingDeadlineSeconds }}
  startingDeadlineSeconds: {{ $job.startingDeadlineSeconds }}
  {{- end }}
  concurrencyPolicy: {{ $job.concurrencyPolicy | default "Forbid" }}
  successfulJobsHistoryLimit: {{ $job.successfulJobsHistoryLimit | default 1 }}
  failedJobsHistoryLimit: {{ $job.failedJobsHistoryLimit | default 3 }}
  {{- if $job.suspend }}
  suspend: {{ $job.suspend }}
  {{- end }}
  jobTemplate:
    spec:
      {{- if not (or (kindIs "invalid" $ttl) (eq (toString $ttl) "")) }}
      ttlSecondsAfterFinished: {{ $ttl }}
      {{- end }}
      {{- if $activeDeadline }}
      activeDeadlineSeconds: {{ $activeDeadline }}
      {{- end }}
      {{- if not (or (kindIs "invalid" $backoff) (eq (toString $backoff) "")) }}
      backoffLimit: {{ $backoff }}
      {{- end }}
      template:
        metadata:
          # The `name` label differs from the web Deployment (`<name>-cronjob` vs
          # `<name>`), so neither the web Deployment nor the Service select these pods.
          labels:
            app.kubernetes.io/name: {{ include "wac.name" $ }}-cronjob
            app.kubernetes.io/instance: {{ $.Release.Name }}
            app.kubernetes.io/component: cronjob-{{ $job.name }}
            app.kubernetes.io/part-of: {{ include "wac.name" $ }}
        spec:
          securityContext:
            {{- include "wac.podSecurityContext" $ | nindent 12 }}
          {{- with include "wac.podIdentity" $ | trim }}{{ . | nindent 10 }}{{- end }}
          restartPolicy: {{ $job.restartPolicy | default "OnFailure" }}
          containers:
            - name: {{ $job.name }}
              image: "{{ $job.image | default $.Values.image.repository }}"
              imagePullPolicy: {{ $.Values.image.pullPolicy }}
              {{- if $job.command }}
              command:
                {{- toYaml $job.command | nindent 16 }}
              {{- end }}
              {{- if $job.args }}
              args:
                {{- toYaml $job.args | nindent 16 }}
              {{- end }}
              {{- if not (or (kindIs "invalid" $resources) (eq (toString $resources) "")) }}
              resources:
                {{- toYaml $resources | nindent 16 }}
              {{- end }}
              securityContext:
                {{- include "wac.containerSecurityContext" $ | nindent 16 }}
              {{- if or $.Values.deployment.env $job.env }}
              env:
                {{- range $key, $value := $.Values.deployment.env }}
                - name: {{ $key }}
                  value: {{ $value | quote }}
                {{- end }}
                {{- range $key, $value := $job.env }}
                - name: {{ $key }}
                  value: {{ $value | quote }}
                {{- end }}
              {{- end }}
              envFrom:
                {{- with include "wac.envFrom" $ | trim }}{{ . | nindent 16 }}{{- end }}
              {{- if or $job.volumes (gt (len $.Values.onePasswordSecrets) 0) }}
              volumeMounts:
                {{- with include "wac.selectedVolumeMounts" (dict "root" $ "names" $job.volumes) | trim }}{{ . | nindent 16 }}{{- end }}
              {{- end }}
          {{- if or $job.volumes (gt (len $.Values.onePasswordSecrets) 0) }}
          volumes:
            {{- with include "wac.selectedVolumes" (dict "root" $ "names" $job.volumes) | trim }}{{ . | nindent 12 }}{{- end }}
          {{- end }}
          {{- with include "wac.jobScheduling" $ | trim }}{{ . | nindent 10 }}{{- end }}
{{- end }}
{{- end }}
